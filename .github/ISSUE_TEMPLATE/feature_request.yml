name: Suggestion
description: An idea for a new feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like the launcher to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
      description: What problem does it solve for you, or what does it make easier?
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else
      description: How other launchers do it, mockups, links...
